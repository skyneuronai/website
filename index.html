<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyNeuron.ai</title>
<style>
  :root {
    --bg: #060911;
    --bg-glow: #0d1424;
    --orbit: #24344a;
    --text: #edeff3;
    --muted: #8b93a6;
    --gold: #e8b94e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 30%, var(--bg-glow) 0%, var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* faint starfield */
  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 25% 70%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 60% 85%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 45% 40%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 70% 35%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 15% 55%, rgba(255,255,255,0.35), transparent);
    background-repeat: no-repeat;
  }

  /* orbital ring with a travelling satellite point */
  .orbit-wrap {
    position: absolute;
    width: min(90vw, 640px);
    aspect-ratio: 1;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .orbit {
    position: absolute;
    inset: 8%;
    border: 1px solid var(--orbit);
    border-radius: 50%;
    transform: rotate(-8deg) scaleY(0.42);
  }

  .satellite {
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    transform: rotate(-8deg) scaleY(0.42);
    animation: spin 22s linear infinite;
  }

  .satellite::before {
    content: "";
    position: absolute;
    top: -3px;
    left: 50%;
    width: 6px;
    height: 6px;
    margin-left: -3px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px 2px rgba(232, 185, 78, 0.6);
  }

  @keyframes spin {
    from { transform: rotate(-8deg) scaleY(0.42) rotate(0deg); }
    to   { transform: rotate(-8deg) scaleY(0.42) rotate(360deg); }
  }

  main {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
  }

  h1 {
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  h1 .dot {
    color: var(--gold);
  }

  .status {
    margin-top: 1.1rem;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.95rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .status::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    margin-right: 0.55em;
    vertical-align: middle;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .contact {
    margin-top: 2.4rem;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.85rem;
  }

  .contact a {
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--orbit);
    padding-bottom: 2px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .contact a:hover,
  .contact a:focus-visible {
    color: var(--gold);
    border-color: var(--gold);
  }

  @media (prefers-reduced-motion: reduce) {
    .satellite { animation: none; }
    .status::before { animation: none; }
  }
</style>
</head>
<body>

  <div class="stars"></div>
  <div class="orbit-wrap" aria-hidden="true">
    <div class="orbit"></div>
    <div class="satellite"></div>
  </div>

  <main>
    <h1>SkyNeuron<span class="dot">.ai</span></h1>
    <p class="status">Coming soon</p>
    <p class="contact"><a href="mailto:skyneuron.ai@gmail.com">skyneuron.ai@gmail.com</a></p>
  </main>

</body>
</html>
